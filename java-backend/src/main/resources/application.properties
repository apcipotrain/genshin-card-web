spring.application.name=genshin-card-account
server.address=${JAVA_BACKEND_HOST:127.0.0.1}
server.port=${JAVA_BACKEND_PORT:8080}
spring.datasource.url=${ACCOUNT_DB_URL:jdbc:h2:file:./data/accounts;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${ACCOUNT_DB_USER:sa}
spring.datasource.password=${ACCOUNT_DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
app.game-service-key=${GAME_SERVICE_KEY:}
app.session-ttl=${ACCOUNT_SESSION_TTL:PT168H}
app.legacy-accounts=${LEGACY_ACCOUNTS_FILE:../server/accounts.json}
